name: Build Android APK

on:
  push:
    branches: ["main", "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Qaysi APK yig'ilsin"
        type: choice
        default: both
        options: [debug, release, both]

env:
  FLUTTER_VERSION: "3.35.x"
  JAVA_VERSION: "17"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || {
            echo "## ❌ flutter analyze" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error •|warning •" analyze.log | head -80 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo "## ✅ flutter analyze — xatolik yo'q" >> "$GITHUB_STEP_SUMMARY"

      - name: Tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log || {
            echo "## ❌ flutter test" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -vE "^\s*$" test.log | grep -E "FAILED|Error|Exception|expected|Actual|at |\.dart" | head -80 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo "## ✅ flutter test — barcha testlar o'tdi" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure (commit comment)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ ${{ github.job }} failed (run ${{ github.run_id }})"
            for f in analyze.log test.log build-debug.log build-release.log; do
              if [ -f "$f" ]; then
                echo; echo "<details><summary>$f</summary>"; echo; echo '```'
                grep -vE "^\s*$" "$f" | grep -iE "error|warning •|FAILED|Exception|What went wrong|expected|Actual|\.dart:[0-9]+" | head -120
                echo '```'; echo "</details>"
              fi
            done
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat report.md)" >/dev/null || true

  build:
    name: Build APK
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Dependencies
        run: flutter pub get

      # ---- Release imzolash (ixtiyoriy) ----
      # Repo Settings → Secrets ga quyidagilarni qo'shing:
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # Agar secret bo'lmasa, release APK debug kalit bilan imzolanadi (test uchun yaroqli).
      - name: Release keystore (if configured)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOT
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOT
          echo "Release keystore configured"

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build-debug.log || {
            echo "## ❌ Debug APK build" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -iE "error|FAILURE|What went wrong|Exception" -A3 build-debug.log | head -100 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: |
          set -o pipefail
          { flutter build apk --release && flutter build apk --release --split-per-abi; } 2>&1 | tee build-release.log || {
            echo "## ❌ Release APK build" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -iE "error|FAILURE|What went wrong|Exception" -A3 build-release.log | head -100 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Report failure (commit comment)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ ${{ github.job }} failed (run ${{ github.run_id }})"
            for f in analyze.log test.log build-debug.log build-release.log; do
              if [ -f "$f" ]; then
                echo; echo "<details><summary>$f</summary>"; echo; echo '```'
                grep -vE "^\s*$" "$f" | grep -iE "error|warning •|FAILED|Exception|What went wrong|expected|Actual|\.dart:[0-9]+" | head -120
                echo '```'; echo "</details>"
              fi
            done
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat report.md)" >/dev/null || true

      - name: Rename artifacts
        run: |
          mkdir -p dist
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          [ -f build/app/outputs/flutter-apk/app-debug.apk ] && cp build/app/outputs/flutter-apk/app-debug.apk "dist/BozorGo-v$VERSION-debug.apk"
          [ -f build/app/outputs/flutter-apk/app-release.apk ] && cp build/app/outputs/flutter-apk/app-release.apk "dist/BozorGo-v$VERSION-release.apk"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$f" ] || continue
            abi=$(basename "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$f" "dist/BozorGo-v$VERSION-release-$abi.apk"
          done
          ls -lh dist
          {
            echo "## 📦 APK fayllar"
            echo '```'
            ls -lh dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: ${{ hashFiles('dist/*-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: BozorGo-debug-apk
          path: dist/*-debug.apk
          retention-days: 14

      - name: Upload release APK
        if: ${{ hashFiles('dist/*-release*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: BozorGo-release-apk
          path: dist/*-release*.apk
          retention-days: 30

      # ---- Tag push qilinganda GitHub Release yaratish ----
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
